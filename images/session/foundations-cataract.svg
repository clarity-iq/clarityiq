<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">The eye, before and after cataract surgery</title>
<desc id="d">Left: a side view of the eye with a cloudy natural lens that scatters light. Right: the same eye with a clear artificial lens (IOL) in its place.</desc>
<defs>
  <radialGradient id="ball" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#FFFDF9"/><stop offset="1" stop-color="#F1E8DA"/></radialGradient>
  <radialGradient id="cloud" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#F4E2BD"/><stop offset=".7" stop-color="#E2C48E"/><stop offset="1" stop-color="#C9A86E"/></radialGradient>
  <linearGradient id="iol" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E4F0EE"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <linearGradient id="vit" x1="0" x2="1"><stop offset="0" stop-color="#FBF7F0"/><stop offset="1" stop-color="#F3EADB"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F3D2C" flood-opacity=".10"/></filter>
  <g id="eye">
    <circle cx="190" cy="215" r="118" fill="url(#vit)" stroke="#BFAE92" stroke-width="2.5"/>
    <path d="M280,148 A112,112 0 0 1 280,282" fill="none" stroke="#D99A86" stroke-width="5" stroke-linecap="round"/>
    <path d="M306,205 h34 v20 h-34z" fill="#E7C9B6" stroke="#BFAE92" stroke-width="2"/>
    <path d="M84,156 Q34,215 84,274" fill="#EAF3F1" fill-opacity=".85" stroke="#4f6b58" stroke-width="3"/>
    <path d="M104,160 L104,192" stroke="#4f6b58" stroke-width="7" stroke-linecap="round"/>
    <path d="M104,238 L104,270" stroke="#4f6b58" stroke-width="7" stroke-linecap="round"/>
  </g>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<g transform="translate(10,0)">
  <rect x="8" y="24" width="336" height="420" rx="26" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="176" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F3D2C">With a cataract</text>
  <g transform="translate(-4,10)">
    <use href="#eye"/>
    <g stroke="#9E4526" stroke-width="2.2" stroke-linecap="round" opacity=".75">
      <path d="M10,180 L116,190"/><path d="M10,215 L116,215"/><path d="M10,250 L116,240"/>
    </g>
    <ellipse cx="124" cy="215" rx="19" ry="44" fill="url(#cloud)" stroke="#A88957" stroke-width="2"/>
    <g fill="#FFFFFF" opacity=".55" filter="url(#soft)"><circle cx="118" cy="198" r="5"/><circle cx="128" cy="222" r="6"/><circle cx="120" cy="238" r="4"/><circle cx="130" cy="200" r="3"/></g>
    <g stroke="#9E4526" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 7" opacity=".45">
      <path d="M144,195 L250,150"/><path d="M144,212 L280,235"/><path d="M144,228 L245,290"/><path d="M144,205 L270,190"/>
    </g>
  </g>
  <g font-family="Inter,system-ui,sans-serif" font-size="15" fill="#3d463f">
    <path d="M120,270 L120,330" stroke="#5d665f" stroke-width="1.2"/><circle cx="120" cy="270" r="3" fill="#5d665f"/>
    <text x="120" y="350" text-anchor="middle">Natural lens,</text><text x="120" y="369" text-anchor="middle">clouded</text>
    <path d="M58,212 L40,120" stroke="#5d665f" stroke-width="1.2"/><circle cx="58" cy="212" r="3" fill="#5d665f"/>
    <text x="40" y="110" text-anchor="middle">Cornea</text>
    <path d="M296,262 L296,350" stroke="#5d665f" stroke-width="1.2"/><circle cx="296" cy="262" r="3" fill="#5d665f"/>
    <text x="294" y="370" text-anchor="middle">Retina</text>
  </g>
  <text x="176" y="420" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#5d665f">Light scatters on the way in</text>
</g>
<g transform="translate(366,0)">
  <rect x="8" y="24" width="336" height="420" rx="26" fill="#FFFDF9" filter="url(#shadow)"/>
  <text x="176" y="62" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F3D2C">After surgery</text>
  <g transform="translate(-4,10)">
    <use href="#eye"/>
    <g stroke="#1F3D2C" stroke-width="2.2" stroke-linecap="round" opacity=".7">
      <path d="M10,180 L116,190"/><path d="M10,215 L116,215"/><path d="M10,250 L116,240"/>
      <path d="M136,191 L300,215"/><path d="M136,215 L300,215"/><path d="M136,239 L300,215"/>
    </g>
    <g fill="none" stroke="#4f6b58" stroke-width="2.6" stroke-linecap="round">
      <path d="M126,178 C146,170 150,152 136,140"/><path d="M126,252 C106,260 102,278 116,290"/>
    </g>
    <ellipse cx="126" cy="215" rx="13" ry="38" fill="url(#iol)" stroke="#1F3D2C" stroke-width="2.2"/>
    <circle cx="300" cy="215" r="4.5" fill="#1F3D2C"/>
  </g>
  <g font-family="Inter,system-ui,sans-serif" font-size="15" fill="#3d463f">
    <path d="M122,262 L122,330" stroke="#5d665f" stroke-width="1.2"/><circle cx="122" cy="262" r="3" fill="#5d665f"/>
    <text x="122" y="350" text-anchor="middle">Clear artificial</text><text x="122" y="369" text-anchor="middle">lens (IOL)</text>
  </g>
  <text x="176" y="420" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#5d665f">A clear lens takes its place</text>
</g>
</svg>
