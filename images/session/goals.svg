<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Your day, near to far</title>
<desc id="d">Three everyday distance scenes: near with reading glasses, a book and a phone; arm's length with a laptop and cooking at a stove; far with night driving headlights and outdoor scenery.</desc>
