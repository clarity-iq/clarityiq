<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Your day at every distance</title>
<desc id="d">Everyday activities arranged from near to far: reading a label, using a phone or tablet, a computer or cooking at arm's length, hobbies like cards or golf, and driving at night.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F3D2C" flood-opacity=".10"/></filter>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
  <path d="M60,388 L660,388" stroke="#c9d8c3" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="426" font-size="16" font-weight="600" fill="#1F3D2C">Near</text>
  <text x="360" y="426" font-size="16" font-weight="600" fill="#1F3D2C">Arm's length</text>
  <text x="600" y="426" font-size="16" font-weight="600" fill="#1F3D2C">Far</text>
  <g fill="#1F3D2C"><circle cx="120" cy="388" r="8"/><circle cx="360" cy="388" r="8"/><circle cx="600" cy="388" r="8"/></g>

  <!-- reading a label (near) -->
  <g transform="translate(70,60)">
    <rect width="100" height="120" rx="20" fill="#FFFDF9" filter="url(#shadow)"/>
    <rect x="34" y="24" width="32" height="58" rx="6" fill="#F5E4D8" stroke="#9E4526" stroke-width="2"/>
    <rect x="30" y="18" width="40" height="10" rx="3" fill="#9E4526" opacity=".8"/>
    <path d="M40,46 h20 M40,56 h20 M40,66 h14" stroke="#9E4526" stroke-width="1.5" opacity=".6"/>
    <text x="50" y="106" font-size="13" fill="#3d463f">Labels, menus</text>
  </g>
  <!-- phone / tablet (near) -->
  <g transform="translate(80,210)">
    <rect width="100" height="120" rx="20" fill="#FFFDF9" filter="url(#shadow)"/>
    <rect x="22" y="20" width="44" height="62" rx="6" fill="#fff" stroke="#1F3D2C" stroke-width="2"/>
    <rect x="56" y="38" width="24" height="44" rx="5" fill="#DCE6D7" stroke="#1F3D2C" stroke-width="2"/>
    <text x="50" y="106" font-size="13" fill="#3d463f">Phone, tablet</text>
  </g>
  <!-- computer (arm's length) -->
  <g transform="translate(250,70)">
    <rect width="104" height="120" rx="20" fill="#FFFDF9" filter="url(#shadow)"/>
    <rect x="20" y="22" width="64" height="44" rx="4" fill="#DCE6D7" stroke="#1F3D2C" stroke-width="2"/>
    <path d="M44,66 v10 M32,80 h40" stroke="#1F3D2C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="106" font-size="13" fill="#3d463f">Computer</text>
  </g>
  <!-- cooking (arm's length) -->
  <g transform="translate(366,200)">
    <rect width="104" height="120" rx="20" fill="#FFFDF9" filter="url(#shadow)"/>
    <path d="M30,46 h44 v26 q0,10 -10,10 h-24 q-10,0 -10,-10z" fill="#F5E4D8" stroke="#9E4526" stroke-width="2"/>
    <path d="M24,46 h56" stroke="#9E4526" stroke-width="3" stroke-linecap="round"/>
    <path d="M44,36 q5,-7 0,-14 M58,36 q5,-7 0,-14" fill="none" stroke="#9E4526" stroke-width="1.6" opacity=".6"/>
    <text x="52" y="106" font-size="13" fill="#3d463f">Cooking</text>
  </g>
  <!-- hobbies: cards / golf -->
  <g transform="translate(486,64)">
    <rect width="100" height="120" rx="20" fill="#FFFDF9" filter="url(#shadow)"/>
    <rect x="22" y="24" width="30" height="44" rx="4" fill="#fff" stroke="#1F3D2C" stroke-width="2" transform="rotate(-10 37 46)"/>
    <rect x="44" y="24" width="30" height="44" rx="4" fill="#fff" stroke="#9E4526" stroke-width="2" transform="rotate(10 59 46)"/>
    <path d="M59,40 l5,7 -5,7 -5,-7z" fill="#9E4526"/>
    <text x="50" y="106" font-size="13" fill="#3d463f">Hobbies</text>
  </g>
  <!-- night driving (far) -->
  <g transform="translate(560,200)">
    <rect width="120" height="120" rx="20" fill="#1F3D2C" filter="url(#shadow)"/>
    <path d="M24,84 L52,34 L68,34 L96,84Z" fill="#3C5A47"/>
    <path d="M60,40 v8 M60,56 v10 M60,72 v10" stroke="#F7F2E9" stroke-width="2.5" opacity=".7"/>
    <circle cx="48" cy="40" r="6" fill="#FFF6D8"/><circle cx="72" cy="40" r="6" fill="#FFF6D8"/>
    <circle cx="48" cy="40" r="14" fill="#FFF6D8" opacity=".18"/><circle cx="72" cy="40" r="14" fill="#FFF6D8" opacity=".18"/>
    <text x="60" y="106" font-size="13" fill="#F7F2E9">Night driving</text>
  </g>
</g>
</svg>
