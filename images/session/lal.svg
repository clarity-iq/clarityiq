<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Light Adjustable Lens: part of the monofocal family</title>
<desc id="d">A monofocal lens implant under a soft beam of light, showing that its power can be fine-tuned with light treatments after the eye heals. A tag points back to the monofocal category.</desc>
<defs>
  <radialGradient id="optic" cx="40%" cy="36%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EAF3F1"/><stop offset="1" stop-color="#C9DDD6"/></radialGradient>
  <linearGradient id="uv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9A6E0" stop-opacity=".75"/><stop offset="1" stop-color="#B9A6E0" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F3D2C" flood-opacity=".10"/></filter>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<g font-family="Inter,system-ui,sans-serif">
  <rect x="24" y="24" width="672" height="432" rx="28" fill="#FFFDF9" filter="url(#shadow)"/>
  <path d="M190,70 L130,330 L330,330 L270,70Z" fill="url(#uv)"/>
  <rect x="180" y="48" width="100" height="30" rx="10" fill="#6E5BA8"/>
  <g transform="translate(230,280)">
    <path d="M-26.9,-58.2 C-14.1,-85.4 21.8,-97.4 49.9,-78.9" fill="none" stroke="#4f6b58" stroke-width="4" stroke-linecap="round"/>
    <path d="M26.9,58.2 C14.1,85.4 -21.8,97.4 -49.9,78.9" fill="none" stroke="#4f6b58" stroke-width="4" stroke-linecap="round"/>
    <circle r="64" fill="url(#optic)" stroke="#1F3D2C" stroke-width="2.6"/>
    <circle r="40" fill="none" stroke="#6E5BA8" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>
    <ellipse cx="-22" cy="-24" rx="14" ry="8" fill="#fff" opacity=".85"/>
  </g>
  <text x="396" y="170" font-size="36" font-weight="600" fill="#1F3D2C">Light</text>
  <text x="396" y="218" font-size="36" font-weight="600" fill="#1F3D2C">Adjustable Lens</text>
  <g transform="translate(396,262)">
    <rect width="240" height="64" rx="32" fill="#DCE6D7"/>
