<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Getting ready for your appointment</title>
<desc id="d">A checklist of questions for your surgeon next to a recovery calendar and eye drops reminder.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3D2C" flood-opacity=".12"/></filter>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<g font-family="Inter,system-ui,sans-serif">
  <!-- Clipboard: Questions for your surgeon -->
  <g transform="translate(46,48)">
    <rect width="360" height="390" rx="24" fill="#FFFDF9" filter="url(#shadow)"/>
    <rect x="120" y="-14" width="120" height="34" rx="10" fill="#4f6b58"/>
    <text x="180" y="64" text-anchor="middle" font-size="25" font-weight="600" fill="#1F3D2C">Questions for</text>
    <text x="180" y="94" text-anchor="middle" font-size="25" font-weight="600" fill="#1F3D2C">your surgeon</text>
    <g>
      <circle cx="48" cy="154" r="18" fill="#DCE6D7"/><text x="48" y="161" text-anchor="middle" font-size="18" font-weight="600" fill="#1F3D2C">1</text>
      <text x="80" y="150" font-size="20" font-weight="600" fill="#1F3D2C">My eye health</text>
      <text x="80" y="174" font-size="17" fill="#5d665f">Measurements &amp; astigmatism</text>

      <circle cx="48" cy="232" r="18" fill="#DCE6D7"/><text x="48" y="239" text-anchor="middle" font-size="18" font-weight="600" fill="#1F3D2C">2</text>
      <text x="80" y="228" font-size="20" font-weight="600" fill="#1F3D2C">Lens options for me</text>
      <text x="80" y="252" font-size="17" fill="#5d665f">Daily range &amp; trade-offs</text>

      <circle cx="48" cy="310" r="18" fill="#DCE6D7"/><text x="48" y="317" text-anchor="middle" font-size="18" font-weight="600" fill="#1F3D2C">3</text>
      <text x="80" y="306" font-size="20" font-weight="600" fill="#1F3D2C">Surgery &amp; recovery</text>
      <text x="80" y="330" font-size="17" fill="#5d665f">Timing between eyes &amp; drops</text>
    </g>
    <path d="M294,364 l44,-44 10,10 -44,44 -14,4z" fill="#9E4526" opacity=".88"/>
  </g>
  <!-- Recovery calendar + eye drops -->
  <g transform="translate(438,68)">
    <rect width="236" height="350" rx="24" fill="#FFFDF9" filter="url(#shadow)"/>
    <path d="M0,24 a24,24 0 0 1 24,-24 h188 a24,24 0 0 1 24,24 v40 h-236z" fill="#1F3D2C"/>
    <text x="118" y="41" text-anchor="middle" font-size="21" font-weight="600" fill="#F7F2E9">Recovery</text>
    <!-- Calendar grid -->
    <g fill="#E2D9C8">
      <rect x="24" y="84" width="28" height="28" rx="6"/><rect x="64" y="84" width="28" height="28" rx="6"/><rect x="104" y="84" width="28" height="28" rx="6"/><rect x="144" y="84" width="28" height="28" rx="6"/><rect x="184" y="84" width="28" height="28" rx="6"/>
      <rect x="24" y="122" width="28" height="28" rx="6"/><rect x="64" y="122" width="28" height="28" rx="6"/><rect x="104" y="122" width="28" height="28" rx="6"/><rect x="144" y="122" width="28" height="28" rx="6"/><rect x="184" y="122" width="28" height="28" rx="6"/>
      <rect x="24" y="160" width="28" height="28" rx="6"/><rect x="64" y="160" width="28" height="28" rx="6"/><rect x="104" y="160" width="28" height="28" rx="6"/>
    </g>
    <g fill="#4f6b58"><rect x="64" y="84" width="28" height="28" rx="6"/><rect x="184" y="122" width="28" height="28" rx="6"/><rect x="104" y="160" width="28" height="28" rx="6"/></g>
    <text x="118" y="216" text-anchor="middle" font-size="19" font-weight="600" fill="#1F3D2C">Follow-up visits</text>
    <!-- Divider + eye drops sketch -->
    <path d="M24,238 h188" stroke="#E2D9C8" stroke-width="2"/>
    <g transform="translate(36,256)">
      <path d="M18,0 l8,18 h-16z" fill="#9E4526"/>
      <rect x="8" y="18" width="20" height="10" rx="3" fill="#4f6b58"/>
      <rect x="4" y="28" width="28" height="36" rx="8" fill="#DCE6D7" stroke="#1F3D2C" stroke-width="2"/>
      <path d="M18,70 q5,7 0,12 q-5,-5 0,-12z" fill="#4f6b58"/>
    </g>
    <text x="90" y="284" font-size="19" font-weight="600" fill="#1F3D2C">Eye drops</text>
    <text x="90" y="308" font-size="17" fill="#5d665f">Day 1 · Week 1 ·</text>
    <text x="90" y="328" font-size="17" fill="#5d665f">Month 1</text>
  </g>
</g>
</svg>
