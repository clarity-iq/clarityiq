<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Welcome</title>
<desc id="d">A calm sketch of an eye beside two welcoming conversation bubbles.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3D2C" flood-opacity=".10"/></filter>
  <radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9DB8A2"/><stop offset=".55" stop-color="#5E7D67"/><stop offset="1" stop-color="#2F4A39"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DCE6D7"/><stop offset="1" stop-color="#DCE6D7" stop-opacity="0"/></radialGradient>
  <clipPath id="lid"><path d="M-142,0 Q0,-104 142,0 Q0,104 -142,0Z"/></clipPath>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<circle cx="205" cy="240" r="195" fill="url(#glow)"/>
<g transform="translate(205,240)">
  <path d="M-142,0 Q0,-104 142,0 Q0,104 -142,0Z" fill="#FFFDF9" filter="url(#shadow)"/>
  <g clip-path="url(#lid)">
    <circle r="62" fill="url(#iris)"/>
    <g stroke="#2F4A39" stroke-width="1.3" opacity=".35">
      <path d="M0,-26 L0,-58 M19,-19 L42,-42 M26,0 L58,0 M19,19 L42,42 M0,26 L0,58 M-19,19 L-42,42 M-26,0 L-58,0 M-19,-19 L-42,-42"/>
      <path d="M10,-24 L21,-53 M24,-10 L53,-21 M24,10 L53,21 M10,24 L21,53 M-10,24 L-21,53 M-24,10 L-53,21 M-24,-10 L-53,-21 M-10,-24 L-21,-53"/>
    </g>
    <circle r="24" fill="#1F2621"/>
    <ellipse cx="-18" cy="-22" rx="12" ry="8.5" fill="#fff" opacity=".9"/>
    <circle cx="17" cy="15" r="3.8" fill="#fff" opacity=".6"/>
  </g>
  <path d="M-142,0 Q0,-104 142,0 Q0,104 -142,0Z" fill="none" stroke="#1F3D2C" stroke-width="3"/>
  <path d="M-138,-8 Q0,-130 138,-8" fill="none" stroke="#4f6b58" stroke-width="2" opacity=".5"/>
</g>
<g font-family="Inter,system-ui,sans-serif">
  <!-- Top conversation bubble -->
  <g transform="translate(366,104)">
    <path d="M0,0 h292 a22,22 0 0 1 22,22 v68 a22,22 0 0 1 -22,22 h-246 l-22,20 v-20 h-24 a22,22 0 0 1 -22,-22 v-68 a22,22 0 0 1 22,-22z" fill="#DCE6D7" filter="url(#shadow)"/>
    <text x="20" y="42" font-size="23" font-weight="600" fill="#1F3D2C">Where you're starting</text>
    <text x="20" y="76" font-size="18" fill="#3d463f">What you've heard &amp; wondered</text>
  </g>
  <!-- Bottom conversation bubble -->
  <g transform="translate(366,264)">
    <path d="M0,0 h292 a22,22 0 0 1 22,22 v68 a22,22 0 0 1 -22,22 h-22 v20 l-22,-20 h-248 a22,22 0 0 1 -22,-22 v-68 a22,22 0 0 1 22,-22z" fill="#FFFDF9" filter="url(#shadow)"/>
    <text x="20" y="42" font-size="23" font-weight="600" fill="#9E4526">At your own pace</text>
    <text x="20" y="76" font-size="18" fill="#3d463f">Ask anything, tap Next to go on</text>
  </g>
</g>
</svg>
