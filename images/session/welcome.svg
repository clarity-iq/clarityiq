<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t d">
<title id="t">Welcome</title>
<desc id="d">A calm sketch of an eye beside conversation cards showing what this session covers.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F3D2C" flood-opacity=".10"/></filter>
  <radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9DB8A2"/><stop offset=".55" stop-color="#5E7D67"/><stop offset="1" stop-color="#2F4A39"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DCE6D7"/><stop offset="1" stop-color="#DCE6D7" stop-opacity="0"/></radialGradient>
  <clipPath id="lid"><path d="M-134,0 Q0,-98 134,0 Q0,98 -134,0Z"/></clipPath>
</defs>
<rect width="720" height="480" fill="#F7F2E9"/>
<circle cx="205" cy="215" r="185" fill="url(#glow)"/>
<g transform="translate(205,215)">
  <path d="M-134,0 Q0,-98 134,0 Q0,98 -134,0Z" fill="#FFFDF9" filter="url(#shadow)"/>
  <g clip-path="url(#lid)">
    <circle r="58" fill="url(#iris)"/>
    <g stroke="#2F4A39" stroke-width="1.3" opacity=".35">
      <path d="M0,-24 L0,-54 M18,-18 L39,-39 M24,0 L54,0 M18,18 L39,39 M0,24 L0,54 M-18,18 L-39,39 M-24,0 L-54,0 M-18,-18 L-39,-39"/>
      <path d="M9,-23 L20,-50 M23,-9 L50,-20 M23,9 L50,20 M9,23 L20,50 M-9,23 L-20,50 M-23,9 L-50,20 M-23,-9 L-50,-20 M-9,-23 L-20,-50"/>
    </g>
    <circle r="23" fill="#1F2621"/>
    <ellipse cx="-17" cy="-21" rx="11" ry="8" fill="#fff" opacity=".9"/>
    <circle cx="16" cy="14" r="3.5" fill="#fff" opacity=".6"/>
  </g>
  <path d="M-134,0 Q0,-98 134,0 Q0,98 -134,0Z" fill="none" stroke="#1F3D2C" stroke-width="3"/>
  <path d="M-130,-8 Q0,-122 130,-8" fill="none" stroke="#4f6b58" stroke-width="2" opacity=".5"/>
</g>
<g font-family="Inter,system-ui,sans-serif">
  <!-- Top conversation bubble -->
  <g transform="translate(368,78)">
    <path d="M0,0 h288 a22,22 0 0 1 22,22 v68 a22,22 0 0 1 -22,22 h-228 l-22,20 v-20 h-24 a22,22 0 0 1 -22,-22 v-68 a22,22 0 0 1 22,-22z" fill="#DCE6D7" filter="url(#shadow)"/>
    <text x="20" y="42" font-size="23" font-weight="600" fill="#1F3D2C">Where you're starting</text>
    <text x="20" y="76" font-size="18" fill="#3d463f">What you've heard &amp; wondered</text>
  </g>
  <!-- Bottom conversation bubble -->
  <g transform="translate(364,234)">
    <path d="M0,0 h292 a22,22 0 0 1 22,22 v68 a22,22 0 0 1 -22,22 h-22 v20 l-22,-20 h-248 a22,22 0 0 1 -22,-22 v-68 a22,22 0 0 1 22,-22z" fill="#FFFDF9" filter="url(#shadow)"/>
    <text x="20" y="42" font-size="23" font-weight="600" fill="#9E4526">At your own pace</text>
    <text x="20" y="76" font-size="19" fill="#3d463f">Ask anything, tap Next to go on</text>
  </g>
  <!-- Bottom flow strip -->
  <g transform="translate(64,394)">
    <rect x="0" y="0" width="170" height="46" rx="23" fill="#FFFDF9" stroke="#c9d8c3" stroke-width="2"/>
    <text x="85" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#1F3D2C">1. Basics</text>
    <path d="M182,23 h28" stroke="#9DB8A2" stroke-width="3" stroke-linecap="round"/>
    <rect x="220" y="0" width="170" height="46" rx="23" fill="#FFFDF9" stroke="#c9d8c3" stroke-width="2"/>
    <text x="305" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#1F3D2C">2. Your goals</text>
    <path d="M402,23 h28" stroke="#9DB8A2" stroke-width="3" stroke-linecap="round"/>
    <rect x="440" y="0" width="170" height="46" rx="23" fill="#FFFDF9" stroke="#c9d8c3" stroke-width="2"/>
    <text x="525" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#1F3D2C">3. Options</text>
  </g>
</g>
</svg>
